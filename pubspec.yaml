  get: ^4.6.6
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.5
  mobkit_dashed_border: ^0.0.8
  flutter_native_splash: ^2.4.0 
  flutter_spinkit: ^5.2.1
  geolocator: ^11.0.0
  geocoding: ^3.0.0 
  path_provider: ^2.1.2
  flutter_foreground_task: ^6.1.3
  flutter_background: ^1.3.0+1
  flutter_image_compress: ^2.3.0
  wakelock_plus: ^1.2.4
  permission_handler: ^11.3.1
  cached_network_image: ^3.3.1
  flutter_dash: ^1.0.0
  fl_chart: ^0.68.0
  syncfusion_flutter_charts: ^25.2.5
  location:
  buttons_tabbar: ^1.3.12
  jwt_decoder: ^2.0.1
  device_info_plus:
  percent_indicator:
  flutter_polyline_points:
  url_launcher:
  animated_digit: ^3.2.3
  flutter_background_service_android: ^6.3.1
  http: ^1.2.2
  disable_battery_optimizations_latest: ^1.0.0
  file_picker: ^10.2.1
  google_maps_flutter: ^2.12.3
  image_picker: ^1.1.2
  flutter_background_service: 5.0.2 
  background_location_2: ^0.16.3
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.1


dependency_overrides: 
  win32: ^5.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^3.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/svg/
  
  
  
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
flutter_native_splash:
  background_image: "assets/images/splash.png"
  color: "#ffffff"
  image: assets/images/splash.png
  android: true
  ios: true
  android_12:
    background_image: "assets/images/splash.png"
    color: "#ffffff"
    image: assets/images/splash.png


